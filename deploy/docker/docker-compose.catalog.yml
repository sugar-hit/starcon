name: starcon-catalog-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starcon_migrator
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Run deploy/scripts/catalog-dev.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing runtime password}
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - catalog-pg-data:/var/lib/postgresql/data
      - ./catalog-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U starcon_migrator -d postgres']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: identity
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1:8081:8081']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_identity
      DB_USER: identity_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'true'
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      # 1.4.2.2 默认店铺与仓库：默认上下文要读 02 渠道与店铺、08 仓储作业的授权只读端点，
      # 跨服务取数一律走 HTTP（跨库 SQL 被 AGENTS.md 禁止）。
      # 这两个地址**没配**时，identity 侧的目录端口会走 Unwired 实现并如实报「未接通」，
      # 而不是返回空清单冒充「这个租户没有店铺 / 仓库」。
      CHANNEL_URL: http://channel:8083
      WAREHOUSE_URL: http://warehouse:8084
  catalog:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: catalog
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8082:8082']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_catalog
      DB_USER: catalog_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      MEDIA_STORAGE_ROOT: /app/data/media
      WAREHOUSE_URL: http://warehouse:8084
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes:
      - catalog-media-data:/app/data/media
  channel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: channel
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8083:8083']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_channel
      DB_USER: channel_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      CHANNEL_SECRET_STORE_DIR: /app/data/channel-secrets
      # 授权凭证存储根目录。与 CHANNEL_SECRET_STORE_DIR 是两个不同的东西：
      # 前者是渠道对接的密钥配置，后者是品牌授权书/证书等上传文档的落盘位置。
      # 不配的话会退回相对路径默认值 target/credential-store ⇒ 解析成 /app/target/...
      # ⇒ UID 10001 无权创建 ⇒ 容器启动失败（AccessDeniedException: /app/target）。
      CREDENTIAL_STORAGE_ROOT: /app/data/credential-store
      # 认证扫描件存储根目录。与上面两个同型：未配时退回相对路径默认值
      # target/certification-store ⇒ 解析成 /app/target/... ⇒ UID 10001 无权创建
      # ⇒ 容器启动失败（AccessDeniedException: /app/target）。
      CERTIFICATION_STORAGE_ROOT: /app/data/certification-store
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes:
      - channel-secret-data:/app/data/channel-secrets
      - channel-credential-data:/app/data/credential-store
      - channel-certification-data:/app/data/certification-store
  warehouse:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: warehouse
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8084:8084']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_warehouse
      DB_USER: warehouse_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  trade:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: trade
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8085:8085']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_trade
      DB_USER: trade_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  crm:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: crm
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8086:8086']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_crm
      DB_USER: crm_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  finance:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: finance
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8087:8087']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_finance
      DB_USER: finance_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  reporting:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: reporting
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8088:8088']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_reporting
      DB_USER: reporting_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      # 导出存储根目录。不配的话会退回相对路径默认值 target/reporting-export-store
      # ⇒ 解析成 /app/target/... ⇒ UID 10001 无权创建 ⇒ 容器启动失败
      # （AccessDeniedException: /app/target）。
      REPORTING_EXPORT_STORAGE_ROOT: /app/data/reporting-export
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes:
      - reporting-export-data:/app/data/reporting-export
  platform:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: platform
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_started }
    ports: ['127.0.0.1:8089:8089']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_platform
      DB_USER: platform_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  migrate-identity:
    image: starcon-catalog-dev-identity
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_identity
      DB_USER: identity_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-catalog:
    image: starcon-catalog-dev-catalog
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_catalog
      DB_USER: catalog_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
  migrate-channel:
    image: starcon-catalog-dev-channel
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_channel
      DB_USER: channel_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      # migrate-* 用的是同一个镜像与同一个 Spring 上下文，
      # 存储实现的构造函数照样会执行 ⇒ 这里也必须给可写的绝对路径。
      CREDENTIAL_STORAGE_ROOT: /app/data/credential-store
      CERTIFICATION_STORAGE_ROOT: /app/data/certification-store
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-warehouse:
    image: starcon-catalog-dev-warehouse
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_warehouse
      DB_USER: warehouse_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-trade:
    image: starcon-catalog-dev-trade
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_trade
      DB_USER: trade_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-crm:
    image: starcon-catalog-dev-crm
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_crm
      DB_USER: crm_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-finance:
    image: starcon-catalog-dev-finance
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_finance
      DB_USER: finance_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-reporting:
    image: starcon-catalog-dev-reporting
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_reporting
      DB_USER: reporting_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      # 同 migrate-channel：存储实现的构造函数会在迁移进程里执行，也需要可写路径。
      REPORTING_EXPORT_STORAGE_ROOT: /app/data/reporting-export
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
  migrate-platform:
    image: starcon-catalog-dev-platform
    profiles: [tools]
    command: ['--spring.main.web-application-type=none']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starcon_platform
      DB_USER: platform_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_MIGRATION_USER: starcon_migrator
      DB_MIGRATION_PASSWORD: ${PG_PASSWORD}
      IDENTITY_URL: http://identity:8081
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCAL_BOOTSTRAP_ENABLED: 'false'
volumes:
  catalog-media-data:
  channel-secret-data:
  channel-credential-data:
  channel-certification-data:
  reporting-export-data:
  catalog-pg-data:
