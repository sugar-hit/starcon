version: '3.9'

# starcon 本地开发基础设施
# 用法: docker compose -f deploy/docker/docker-compose.dev.yml up -d
#
# 🔴 **两条纪律**（本文件此前是仓库里唯一一处反例）：
#
# 1. **端口只绑 127.0.0.1**。写成 `5432:5432` 等于把本机数据库、
#    缓存、对象存储**开到整个局域网** —— 同一份仓库里的
#    docker-compose.catalog.yml 一直写的是 `127.0.0.1:5433:5432`，
#    这里跟它对齐。
# 2. **口令不写死在仓库里**，从环境变量注入且**缺了就直接失败**。
#    `${VAR:?提示}` 的语义是「没设就报错退出」，而不是悄悄用默认值 ——
#    悄悄用默认值的后果是：所有人都用同一个可猜的口令，
#    而机器上还开着对外端口。
#
# 本地开发的默认口令由 scripts/bootstrap.sh 生成到 .env（.env 已 gitignore）；
# 想自己指定就设这两个变量：
#   DEV_POSTGRES_PASSWORD / DEV_MINIO_ROOT_PASSWORD

services:
  postgres:
    image: postgres:16-alpine
    container_name: starcon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starcon
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?缺少 DEV_POSTGRES_PASSWORD，请先设置（scripts/bootstrap.sh 会自动生成）}
      POSTGRES_DB: starcon
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starcon']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: starcon-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: starcon-kafka
    restart: unless-stopped
    ports:
      - '127.0.0.1:9092:9092'
      - '127.0.0.1:9094:9094'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: 'controller,broker'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_KRAFT_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  mailhog:
    image: mailhog/mailhog:latest
    container_name: starcon-mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  minio:
    image: minio/minio:latest
    container_name: starcon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: starcon
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_ROOT_PASSWORD:?缺少 DEV_MINIO_ROOT_PASSWORD，请先设置（scripts/bootstrap.sh 会自动生成）}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: starcon-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

volumes:
  postgres-data:
  minio-data:
