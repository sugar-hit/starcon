server:
  port: 8083
  error:
    include-message: always
spring:
  application:
    name: channel
  servlet:
    multipart:
      # 16.2.2.2 认证扫描件直连上传（multipart）的上限；服务层另有 10 MB 硬限。
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
  jooq:
    sql-dialect: POSTGRES
  jackson:
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  api-docs:
    version: OPENAPI_3_0
    enabled: true
