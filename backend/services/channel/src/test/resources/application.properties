# 测试作用域配置。只在 test classpath 生效，不进任何生产制品与部署配置。
#
# 为什么必须在测试作用域补这个属性：WebhookService 构造器上的
# @Value("${CHANNEL_WEBHOOK_SIGNING_KEY}") 是刻意不给默认值的——生产环境缺这个
# 主密钥必须启动失败，而不是带着一把可预测的默认密钥跑起来。给它加默认值等于给
# 生产发一把公开密钥，是安全回归，所以修法只能落在这里。
#
# 为什么用 .properties 而不是 .yml：classpath 上 test-classes 排在 classes 前面，
# 同名的 application.yml 会被测试目录整个遮蔽掉 target/classes 里那份，
# spring.datasource.url / jooq / jackson 等主配置随之全部丢失，表现为
# "Failed to determine a suitable driver class"。.properties 是另一种扩展名，
# Spring Boot 会把它和 classes 里的 application.yml 一起加载，两者不冲突。
#
# 取值格式：base64 编码的 32 字节 AES-256 密钥。WebhookSignature.keyOf 校验解码后
# 必须正好 32 字节，短密钥会让 AES 直接抛错。下面是 base64 的
# "0123456789abcdef0123456789abcdef"，与 OpenApiContractTest /
# WebhookReceiptIntegrationTest 各自注册的值一致，纯测试用途，不是密钥材料。

CHANNEL_WEBHOOK_SIGNING_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
