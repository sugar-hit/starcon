# ============================================================
# trade **测试**的上游地址兜底值。
#
# 为什么必须有这个文件：主代码里 CATALOG_URL / WAREHOUSE_URL / CHANNEL_URL 的默认值是
#   http://127.0.0.1:8082 / http://127.0.0.1:8084 / http://127.0.0.1:8083
# 而这三个端口正是 deploy/docker/docker-compose.catalog.yml 映射到宿主机的**真实服务端口**
# （catalog=8082 / channel=8083 / warehouse=8084）。⇒ 任何一个**忘了显式给上游地址**的
# 测试类，都会去敲**这台机器上碰巧在跑的那台服务**：结果取决于「跑测试那一刻机器上跑着
# 什么」，而不是取决于被测代码。这是顺序/环境依赖的测试缺陷的温床 —— 2026-10-22 批次 L2
# 的 trade 段就是这么红的（上游回 404，trade 如实报 503「商品主数据服务返回 404」）。
#
# 这里把兜底值换成**必然连不通**的哨兵（端口 1 = tcpmux，没有任何服务会监听它）：
#   · 显式给了上游地址的测试类不受影响 —— @DynamicPropertySource 的优先级高于本文件；
#   · 忘了给的测试类一旦真的走到上游 ⇒ 立刻 503「暂时不可达」⇒ **响亮失败**，
#     不会再静默地敲到机器上的真服务。
#
# 本文件**不**改主代码的默认值：生产上 CATALOG_URL 等由 deploy/docker 显式注入
# （服务名形式，如 http://identity:8081），默认值只是本地开发的兜底。
#
# 回归用例：TradeUpstreamAddressIsolationTest —— 钉住「兜底值不得是机器全局地址，
# 且必须真的连不通」。
# ============================================================
CATALOG_URL=http://127.0.0.1:1
WAREHOUSE_URL=http://127.0.0.1:1
CHANNEL_URL=http://127.0.0.1:1
