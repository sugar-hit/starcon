name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:codegen

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm build

  security:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      - run: pnpm audit --audit-level=high

  backend:
    name: Java 21 & PostgreSQL Integration (${{ matrix.module }})
    runs-on: ubuntu-latest
    # 🔴 按服务拆矩阵，而不是 9 个服务挤一个 reactor。
    #
    # 为什么：每个集成测试类都会拉起一个 Testcontainers PostgreSQL 并跑一遍 Flyway，
    # 9 个服务串在一条 reactor 上实测 163 分钟（catalog 31 + warehouse 31 + 其余），
    # 离 180 分钟的超时上限只剩 17 分钟 —— 再多一个慢模块就会整轮红，
    # 而「整轮红」与「某个模块红」在合并门禁上是同一个后果。
    #
    # 拆开之后每个服务一个独立 runner，最慢的那个约 35 分钟 ⇒ 整轮 40 分钟内出结果，
    # 离超时上限有 2 倍以上的余量。代价是 runner 分钟数约翻倍（9 × 35 ≈ 315 分钟），
    # 换来的是「一次就能修完所有红灯」而不是「一次只能修一个」。
    #
    # fail-fast: false ⇒ 一个服务炸了，其余 8 个照跑 ⇒ 一次跑出全部失败，
    # 不用等下一轮才发现第二个模块也红了。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module:
          - identity
          - catalog
          - channel
          - warehouse
          - trade
          - crm
          - finance
          - reporting
          - platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # -pl services/<module> -am 只构建这一个服务（+ 父工程 + tenancy）；
      # 服务之间**没有**互相依赖（每个服务只依赖 tenancy），所以单模块构建是完整的。
      #
      # ⚠️ 这里**故意不加 -Dtest 过滤**：一过滤就有「过滤表达式写错 ⇒ 静默跑 0 个
      # 用例却报绿」的风险，那比红灯更坏 —— 它会让整个后端门禁形同虚设。
      # 每个服务跑自己的全量用例，慢一点，但绿是真的绿。
      - run: ./mvnw -B -ntp -fae verify -pl services/${{ matrix.module }} -am
        working-directory: backend
        env:
          JAVA_TOOL_OPTIONS: -Dapi.version=1.44
          # 与 backend/pom.xml 里 surefire 钉的时区一致，双保险：
          # 测试 JVM 的默认时区决定 timestamptz 读回来的偏移量，
          # runner 默认是 UTC，仓库断言的是 +08:00。
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports-${{ matrix.module }}
          path: backend/**/target/surefire-reports/*.xml
          retention-days: 7
          if-no-files-found: ignore

  catalog-e2e:
    name: Catalog Browser & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: ./deploy/scripts/catalog-dev.sh
      - name: Wait for all services
        run: |
          for port in 8081 8082 8083 8084 8085 8086 8087 8088 8089; do
            ready=false
            for attempt in $(seq 1 150); do
              if curl --fail --silent "http://localhost:$port/v3/api-docs" >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if ! "$ready"; then
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 150 identity catalog postgres
              exit 1
            fi
          done
      - name: Verify fresh database initialization did not require a restart
        run: |
          container=$(docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -q postgres)
          test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
      - name: Verify writable storage as the runtime user
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T catalog sh -c 'test "$(id -u)" = 10001 && test -w "$MEDIA_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CHANNEL_SECRET_STORE_DIR"'
          # 授权凭证存储与导出存储的根目录同样必须存在且可写。
          # 这两个存储实现在构造函数里就 createDirectories(root)，
          # 目录不存在或不可写会让服务直接启动失败 ——
          # 漏配 env 时它们退回相对路径默认值，在容器里解析到 /app/target/...，
          # 而 /app 属主是 root、进程以 UID 10001 运行 ⇒ AccessDeniedException。
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CREDENTIAL_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CERTIFICATION_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T reporting sh -c 'test "$(id -u)" = 10001 && test -w "$REPORTING_EXPORT_STORAGE_ROOT"'
          # 导入导出任务的落盘根目录同理：LocalImportExportStorage 在构造函数里就
          # createDirectories(root)，漏配 env 时它退回相对路径默认值
          # target/platform-io-store ⇒ 解析成 /app/target/... ⇒ UID 10001 无权创建
          # ⇒ 构造器抛异常 ⇒ platform 起不来 ⇒ 本作业等 8089 超时。
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T platform sh -c 'test "$(id -u)" = 10001 && test -w "$PLATFORM_IO_STORAGE_ROOT"'
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/api-contracts/src
      - run: pnpm exec playwright test tests/e2e/catalog.spec.ts
      - name: Backend diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -a
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 200 postgres identity catalog channel warehouse trade crm finance reporting platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-screenshots
          path: |
            work/catalog-*.png
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [lint, typecheck, test, build, security, backend, catalog-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every layer to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(r == 'success' for r in results), results
          PYTHON
