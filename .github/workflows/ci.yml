name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:codegen

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      - run: pnpm audit --audit-level=high

  backend:
    name: Java 21 & PostgreSQL Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify spotless:check
        working-directory: backend
        env:
          JAVA_TOOL_OPTIONS: -Dapi.version=1.44

  catalog-e2e:
    name: Catalog Browser & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: ./deploy/scripts/catalog-dev.sh
      - name: Wait for all services
        run: |
          for port in 8081 8082 8083 8084 8085 8086 8087 8088 8089; do
            ready=false
            for attempt in $(seq 1 150); do
              if curl --fail --silent "http://localhost:$port/v3/api-docs" >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if ! "$ready"; then
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 150 identity catalog postgres
              exit 1
            fi
          done
      - name: Verify fresh database initialization did not require a restart
        run: |
          container=$(docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -q postgres)
          test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
      - name: Verify writable storage as the runtime user
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T catalog sh -c 'test "$(id -u)" = 10001 && test -w "$MEDIA_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CHANNEL_SECRET_STORE_DIR"'
          # 授权凭证存储与导出存储的根目录同样必须存在且可写。
          # 这两个存储实现在构造函数里就 createDirectories(root)，
          # 目录不存在或不可写会让服务直接启动失败 ——
          # 漏配 env 时它们退回相对路径默认值，在容器里解析到 /app/target/...，
          # 而 /app 属主是 root、进程以 UID 10001 运行 ⇒ AccessDeniedException。
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CREDENTIAL_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CERTIFICATION_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T reporting sh -c 'test "$(id -u)" = 10001 && test -w "$REPORTING_EXPORT_STORAGE_ROOT"'
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/api-contracts/src
      - run: pnpm exec playwright test tests/e2e/catalog.spec.ts
      - name: Backend diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -a
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 200 postgres identity catalog channel warehouse trade crm finance reporting platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-screenshots
          path: work/catalog-*.png
