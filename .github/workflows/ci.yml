name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tools:
    name: Workflow Tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/module-progress/test-workflow.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node22-lint-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node22-lint-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node22-typecheck-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node22-typecheck-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:codegen

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, workflow-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node22-build-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node22-build-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm build

  security:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      - run: pnpm audit --audit-level=high

  backend:
    name: Java 21 & PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java formatting (fail before database tests)
        run: ./mvnw -B -ntp spotless:check
        working-directory: backend
      - run: ./mvnw -B -ntp verify
        working-directory: backend
        env:
          JAVA_TOOL_OPTIONS: -Dapi.version=1.44
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/*.xml
          retention-days: 7
          if-no-files-found: ignore

  catalog-e2e:
    needs: [lint, typecheck, test, workflow-tools]
    name: Catalog Browser & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: ./deploy/scripts/catalog-dev.sh
      - name: Wait for all services
        run: |
          for port in 8081 8082 8083 8084 8085 8086; do
            ready=false
            for attempt in $(seq 1 150); do
              if curl --fail --silent "http://localhost:$port/v3/api-docs" >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if ! "$ready"; then
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps
              docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 150 identity catalog postgres
              exit 1
            fi
          done
      - name: Verify fresh database initialization did not require a restart
        run: |
          container=$(docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -q postgres)
          test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
      - name: Verify writable storage as the runtime user
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T catalog sh -c 'test "$(id -u)" = 10001 && test -w "$MEDIA_STORAGE_ROOT"'
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml exec -T channel sh -c 'test "$(id -u)" = 10001 && test -w "$CHANNEL_SECRET_STORE_DIR"'
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/api-contracts/src
      - run: pnpm exec playwright test tests/e2e/catalog.spec.ts
      - name: Backend diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml ps -a
          docker compose --env-file deploy/.env.catalog.local -f deploy/docker/docker-compose.catalog.yml logs --no-color --tail 200 postgres identity catalog channel warehouse trade crm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-screenshots
          path: |
            work/catalog-*.png
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [workflow-tools, lint, typecheck, test, build, security, backend, catalog-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every layer to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(r == 'success' for r in results), results
          PYTHON
