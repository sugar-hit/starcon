<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="starcon">
  <!--
    Favicon — B1-5 极简版
    16px 及以下小尺寸场景专用
    圆点稍大(r=10)、臂稍粗,保证小尺寸下不糊
    详见 docs/design/visual-spec.md §9.3 (B1-5) + §9.5 (16px)
  -->
  <g fill="#0A0A0A">
    <!-- 圆角菱形主体 (比 B1-1 臂更粗, 顶点更靠外) -->
    <path d="M32 8 Q41 23 56 32 Q41 41 32 56 Q23 41 8 32 Q23 23 32 8 Z"/>
    <!-- 4 节点圆点 (r=10) -->
    <circle cx="32" cy="6" r="10"/>
    <circle cx="58" cy="32" r="10"/>
    <circle cx="32" cy="58" r="10"/>
    <circle cx="6" cy="32" r="10"/>
  </g>
</svg>