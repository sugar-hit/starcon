<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="starcon logo">
  <!--
    Mark + 字标 横版 lockup
    mark 在左 (64×64),字标在右 (宽 ~200)
    间距 16 (≈ 字标 x-height × 0.4)
    详见 docs/design/visual-spec.md §9.4
  -->
  <g fill="#0A0A0A">
    <!-- Mark -->
    <path d="M32 10 L40 24 L54 32 L40 40 L32 54 L24 40 L10 32 L24 24 Z"/>
    <circle cx="32" cy="10" r="8"/>
    <circle cx="54" cy="32" r="8"/>
    <circle cx="32" cy="54" r="8"/>
    <circle cx="10" cy="32" r="8"/>
  </g>
  <!-- 字标 -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif">
    <text x="80" y="36" font-size="28" font-weight="900" letter-spacing="1.4" fill="#0A0A0A">STARCON</text>
    <text x="82" y="56" font-size="11" font-weight="500" letter-spacing="0.5" fill="#707070">Commerce OS</text>
  </g>
</svg>