<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="starcon mark">
  <defs>
    <!-- 主背景渐变：深蓝 → 靛紫 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="55%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- 顶部高光（很弱，营造玻璃感） -->
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. 圆角方块背景 -->
  <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>

  <!-- 2. 顶部高光 -->
  <rect width="40" height="20" rx="9" fill="url(#hl)"/>

  <!-- 3. 六边网络（暗示 cross-border / global） -->
  <g stroke="white" stroke-opacity="0.22" stroke-width="0.7" fill="none">
    <path d="M20 9 L29 14 L29 24 L20 29 L11 24 L11 14 Z"/>
  </g>

  <!-- 4. 罗盘指针（白色钻石，朝上） -->
  <g transform="translate(20, 20)">
    <path d="M0 -9 L3 0 L0 9 L-3 0 Z" fill="white"/>
    <!-- 中央分隔带 -->
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 5. 4 个方位点（白色，小） -->
  <circle cx="20" cy="8.5" r="1.1" fill="white"/>
  <circle cx="31.5" cy="20" r="1.1" fill="white" fill-opacity="0.7"/>
  <circle cx="20" cy="31.5" r="1.1" fill="white" fill-opacity="0.55"/>
  <circle cx="8.5" cy="20" r="1.1" fill="white" fill-opacity="0.7"/>

  <!-- 6. 右上角金色星（识别点） -->
  <g transform="translate(32.5, 8.5)">
    <path d="M0 -2.6 L0.78 -0.78 L2.6 0 L0.78 0.78 L0 2.6 L-0.78 0.78 L-2.6 0 L-0.78 -0.78 Z"
          fill="#FBBF24"/>
    <circle r="0.5" fill="white" fill-opacity="0.9"/>
  </g>
</svg>