<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="starcon mark">
  <!--
    starcon 主 mark — B1-1 经典版
    设计理念: "四个商业节点连接,形成中心之星"
    4 节点 = 4 业务系统(开发/运营/物流/仓储)
    中心 4 角星 = STAR 概念 + 业务汇聚
    详见 docs/design/visual-spec.md §9 + brand-source-b1-refined.png
  -->
  <g fill="#0A0A0A">
    <!-- 4 角星主体 (外尖 22, 内尖 ~11.3) -->
    <path d="M32 10 L40 24 L54 32 L40 40 L32 54 L24 40 L10 32 L24 24 Z"/>
    <!-- 4 节点圆点 -->
    <circle cx="32" cy="10" r="8"/>
    <circle cx="54" cy="32" r="8"/>
    <circle cx="32" cy="54" r="8"/>
    <circle cx="10" cy="32" r="8"/>
  </g>
</svg>