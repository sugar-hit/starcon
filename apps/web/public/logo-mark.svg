<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="starcon mark">
  <!--
    starcon 主 mark — B1-1 经典版
    设计理念: "四个商业节点连接,形成中心之星"
    4 节点 = 4 业务系统(开发/运营/物流/仓储)
    中央菱形 = STAR 概念 + 业务汇聚
    详见 docs/design/visual-spec.md §9 + brand-source-b1-refined.png

    几何:
    - 4 圆点 (32,6) (58,32) (32,58) (6,32), r=8
    - 圆角菱形主体: 4 条 Q 弧线连接 4 顶点, 弧线凹向中心
    - 中央负空间 = 由 4 凹弧围成的圆角菱形
  -->
  <g fill="#0A0A0A">
    <!-- 圆角菱形主体 -->
    <path d="M32 10 Q40 24 54 32 Q40 40 32 54 Q24 40 10 32 Q24 24 32 10 Z"/>
    <!-- 4 节点圆点 -->
    <circle cx="32" cy="6" r="8"/>
    <circle cx="58" cy="32" r="8"/>
    <circle cx="32" cy="58" r="8"/>
    <circle cx="6" cy="32" r="8"/>
  </g>
</svg>