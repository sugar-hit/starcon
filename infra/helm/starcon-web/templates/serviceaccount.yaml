{{/*
=============================================================================
ServiceAccount
=============================================================================
前端不访问 K8s API，令牌不挂载。
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starcon-web.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starcon-web.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
