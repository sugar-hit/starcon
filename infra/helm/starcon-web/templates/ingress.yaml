{{/*
=============================================================================
Ingress —— 前端对外入口
=============================================================================
⚠️ 前端有一道**同源校验**：写请求（POST/PUT/DELETE）会比对请求的 origin
   与 request.nextUrl.origin，不一致就返回 403
   （见 apps/web/src/lib/api-proxy.ts）。
   request.nextUrl 来自 Next.js 对 X-Forwarded-Proto / X-Forwarded-Host 的解析，
   所以 Ingress **必须**正确转发这两个头，否则所有写操作都会 403。
   nginx-ingress 默认就带这两个头，不要用注解把它们覆盖掉。
*/}}
{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.ingress.host }}
{{- range .Values.ingress.extraHosts }}
{{- $hosts = append $hosts . }}
{{- end }}
{{/*
🔴 拒绝示例主机名：values.yaml 里的 `starcon.example.com` 是占位符，不是可用的地址。
   带着它装上去，Ingress 会把全部流量送进一个不存在的域名 ——
   而且安装过程一声不响。后端 chart 的 services.<名>.ingress.host 早就用 required() 守着了，
   这里不能比它松。
*/}}
{{- range $hosts }}
{{- if eq . "starcon.example.com" }}
{{- fail "starcon-web: ingress.host 仍是示例值 starcon.example.com，必须填真实主机名（--set ingress.host=erp.你的域名）" }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "starcon-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starcon-web.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ include "starcon-web.tlsSecretName" . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "starcon-web.fullname" $ }}
                port:
                  number: {{ $.Values.port }}
    {{- end }}
{{- end }}
