{{/*
=============================================================================
Service —— 前端
=============================================================================
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "starcon-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starcon-web.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "starcon-web.selectorLabels" . | nindent 4 }}
