apiVersion: v2
name: starcon-backend
description: starcon 后端 —— 9 个 Java Spring Boot 微服务的 Helm 部署件（每服务独占数据库）
type: application
# chart 自身版本（部署件形态变更时 +1）
version: 0.1.0
# 默认对应 backend/pom.xml 的 <version>，也是 Dockerfile.backend 里 jar 的版本段
appVersion: "0.1.0-SNAPSHOT"
kubeVersion: ">=1.25.0-0"
keywords:
  - starcon
  - erp
  - microservices
  - spring-boot
sources:
  - https://github.com/starcon/starcon
maintainers:
  - name: starcon platform team
annotations:
  # 后端不是「一个可水平扩的应用」而是「9 个各自独立的微服务」，
  # 这个标签让同一命名空间里能按服务粒度筛。
  starcon.io/component: backend
