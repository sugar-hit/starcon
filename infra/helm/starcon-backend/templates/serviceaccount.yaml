{{/*
=============================================================================
ServiceAccount
=============================================================================
后端不访问 K8s API，令牌一律不挂载（automountServiceAccountToken: false）。
所以这个 SA 只是个身份标识，不授予任何权限。
*/}}
{{- if .Values.common.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starcon-backend.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starcon-backend.labels" . | nindent 4 }}
  {{- with .Values.common.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
