{{/*
=============================================================================
ExternalSecret —— 每个服务一份，由 ESO 同步到集群内的 Secret
=============================================================================
AGENTS.md：任何 secret / API key 一律不入仓库，走 secret manager
（K8s External Secrets / Vault）。本 chart 不生成明文 Secret，
只声明「去哪个 SecretStore 取哪个键」。

生成的 k8s Secret 名 = <fullname>-<服务名>，
Deployment 用 secretKeyRef 引用它，ESO 同步后 Pod 才会起来。
*/}}
{{- if .Values.secretManager.enabled }}
{{- if .Values.secretManager.create }}
{{- $root := . }}
{{- range $name, $svcRaw := .Values.services }}
{{- if $svcRaw.enabled }}
{{- $cfg := mergeOverwrite (deepCopy $root.Values.common) (deepCopy $svcRaw) }}
{{- $secretName := include "starcon-backend.secretName" (dict "ctx" $root "name" $name) }}
{{- $remoteKeys := $root.Values.secretManager.remoteKeys }}
{{- /* 本服务需要的 Secret 键：三个通用键 + 该服务声明的 secretEnv */}}
{{- $keys := list "db-password" "db-migration-password" "internal-key" }}
{{- range $se := $cfg.secretEnv }}
{{- $keys = append $keys $se.key }}
{{- end }}
{{- /* 已经指定了现成 Secret 就不再创建 */}}
{{- if not (and $cfg.secret $cfg.secret.existingSecret) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "starcon-backend.labels" $root | nindent 4 }}
    starcon.io/service: {{ $name }}
  {{- with $root.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $root.Values.secretManager.refreshInterval }}
  secretStoreRef:
    kind: {{ $root.Values.secretManager.storeRef.kind }}
    name: {{ $root.Values.secretManager.storeRef.name }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key := $keys }}
    {{- $remote := index $remoteKeys $key }}
    {{- if not $remote }}
    {{- fail (printf "starcon-backend: secretManager.remoteKeys 缺少 %q 的远端路径映射" $key) }}
    {{- end }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote | replace "{service}" $name | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

