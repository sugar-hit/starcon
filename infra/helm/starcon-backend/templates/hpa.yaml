{{/*
=============================================================================
HorizontalPodAutoscaler —— 每个服务一份（默认关闭）
=============================================================================
需要集群里有 metrics-server。开启后 Deployment 里的 replicas 字段会被
HPA 接管（模板里已按 autoscaling.enabled 判断，不再写死 replicas）。
*/}}
{{- $root := . }}
{{- range $name, $svcRaw := .Values.services }}
{{- if $svcRaw.enabled }}
{{- $cfg := mergeOverwrite (deepCopy $root.Values.common) (deepCopy $svcRaw) }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-%s" (include "starcon-backend.fullname" $root) $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "starcon-backend.labels" $root | nindent 4 }}
    starcon.io/service: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" (include "starcon-backend.fullname" $root) $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas | default 8 }}
  metrics:
    {{- if $cfg.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $cfg.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
